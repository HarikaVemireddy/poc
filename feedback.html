<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Feedback</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-void: #05070c;
    --bg-panel: #0d1219;
    --bg-card: #10161f;
    --accent: #fbbf24;
    --accent-ink: #2b1c02;
    --text: #e6edf3;
    --muted: #6b7684;
    --border: #1c232d;
    --error: #f47174;
    --success: #86efac;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Inter', sans-serif;
    background: var(--bg-void);
    color: var(--text);
    min-height: 100vh;
    display: flex;
  }
  .terminal {
    flex: 1;
    background: var(--bg-panel);
    background-image:
      linear-gradient(rgba(251,191,36,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(251,191,36,0.04) 1px, transparent 1px);
    background-size: 28px 28px;
    padding: 48px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    position: relative;
    overflow: hidden;
    min-width: 0;
  }
  .terminal::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, var(--accent), transparent 60%);
  }
  .brand {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.06em;
    color: var(--accent);
    margin-bottom: 60px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .brand .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 8px var(--accent); }
  .console {
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    line-height: 1.9;
    color: var(--muted);
    max-width: 420px;
  }
  .console .prompt { color: var(--accent); }
  .console .line { opacity: 0; animation: reveal 0.4s forwards; white-space: pre-wrap; }
  .console .line:nth-child(1) { animation-delay: 0.2s; }
  .console .line:nth-child(2) { animation-delay: 0.9s; }
  .console .line:nth-child(3) { animation-delay: 1.6s; }
  .console .line:nth-child(4) { animation-delay: 2.3s; }
  @keyframes reveal { to { opacity: 1; } }
  .cursor {
    display: inline-block;
    width: 8px; height: 16px;
    background: var(--accent);
    animation: blink 1s step-end infinite;
    vertical-align: middle;
    margin-left: 2px;
  }
  @keyframes blink { 50% { opacity: 0; } }
  .headline {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 30px;
    font-weight: 500;
    margin-top: 44px;
    max-width: 380px;
    line-height: 1.3;
    color: var(--text);
    opacity: 0;
    animation: reveal 0.6s forwards;
    animation-delay: 3.0s;
  }
  .headline span { color: var(--accent); }

  .panel-form {
    flex: 1;
    background: var(--bg-void);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px;
  }
  .form-wrap { width: 100%; max-width: 400px; }
  .eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--muted);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 10px;
  }
  h1 { font-family: 'Space Grotesk', sans-serif; font-size: 28px; font-weight: 500; margin-bottom: 8px; }
  .sub { color: var(--muted); font-size: 14px; margin-bottom: 34px; }

  form { display: flex; flex-direction: column; gap: 26px; }

  .field-block label {
    display: block;
    font-size: 13px;
    color: var(--text);
    margin-bottom: 12px;
  }

  .star-rating { display: flex; gap: 6px; font-size: 30px; }
  .star-rating .star { cursor: pointer; color: var(--border); transition: color 0.15s, transform 0.1s; }
  .star-rating .star.filled { color: var(--accent); }
  .star-rating .star:hover { transform: scale(1.15); }

  .scale-row { display: flex; gap: 8px; }
  .scale-btn {
    flex: 1;
    text-align: center;
    padding: 10px 0;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--bg-card);
    color: var(--muted);
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .scale-btn:hover { border-color: var(--accent); color: var(--text); }
  .scale-btn.selected { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
  .scale-labels { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); margin-top: 8px; font-family: 'JetBrains Mono', monospace; }

  .field textarea {
    width: 100%;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 13px 14px;
    color: var(--text);
    font-size: 14px;
    font-family: 'Inter', sans-serif;
    min-height: 100px;
    resize: vertical;
  }
  .field textarea::placeholder { color: #3d4552; }
  .field textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(251,191,36,0.14); }

  .checkbox-row { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; }
  .checkbox-row input { accent-color: var(--accent); width: 15px; height: 15px; }

  button.submit {
    background: var(--accent);
    color: var(--accent-ink);
    border: none;
    border-radius: 6px;
    padding: 14px;
    font-size: 14px;
    font-weight: 600;
    font-family: 'Space Grotesk', sans-serif;
    cursor: pointer;
    transition: transform 0.1s, background 0.15s;
    letter-spacing: 0.02em;
  }
  button.submit:hover { background: #fcd34d; }
  button.submit:active { transform: scale(0.98); }
  button.submit:disabled { opacity: 0.5; cursor: default; }

  .msg { font-size: 12px; color: var(--error); margin-top: 6px; min-height: 14px; }

  .success-box {
    display: none;
    align-items: center; gap: 10px;
    background: rgba(134,239,172,0.08);
    border: 1px solid rgba(134,239,172,0.3);
    color: var(--success);
    padding: 14px 16px;
    border-radius: 6px;
    font-size: 13px;
    font-family: 'JetBrains Mono', monospace;
  }
  .success-box.show { display: flex; }

  @media (max-width: 820px) {
    body { flex-direction: column; }
    .terminal { min-height: 240px; padding: 32px; }
    .headline { font-size: 22px; }
  }
</style>
</head>
<body>

  <div class="terminal">
    <div class="brand"><span class="dot"></span>POC // FEEDBACK</div>
    <div class="console">
      <div class="line"><span class="prompt">$</span> survey --launch</div>
      <div class="line">&gt; session started</div>
      <div class="line"><span class="prompt">$</span> collecting response</div>
      <div class="line">&gt; awaiting input<span class="cursor"></span></div>
    </div>
    <div class="headline">Your <span>feedback</span> shapes what we build next.</div>
  </div>

  <div class="panel-form">
    <div class="form-wrap">
      <div class="eyebrow">Quick survey</div>
      <h1>How are we doing?</h1>
      <p class="sub">Takes about 30 seconds. Thanks for your time.</p>

      <form id="feedbackForm" novalidate>
        <div class="field-block">
          <label>Overall, how would you rate your experience?</label>
          <div class="star-rating" id="starRating">
            <span class="star" data-value="1">★</span>
            <span class="star" data-value="2">★</span>
            <span class="star" data-value="3">★</span>
            <span class="star" data-value="4">★</span>
            <span class="star" data-value="5">★</span>
          </div>
          <div class="msg" id="starMsg"></div>
        </div>

        <div class="field-block">
          <label>How likely are you to recommend us to a friend?</label>
          <div class="scale-row" id="npsScale">
            <div class="scale-btn" data-value="1">1</div>
            <div class="scale-btn" data-value="2">2</div>
            <div class="scale-btn" data-value="3">3</div>
            <div class="scale-btn" data-value="4">4</div>
            <div class="scale-btn" data-value="5">5</div>
          </div>
          <div class="scale-labels"><span>Not likely</span><span>Very likely</span></div>
        </div>

        <div class="field-block">
          <label for="comments">Anything you'd like us to improve?</label>
          <div class="field">
            <textarea id="comments" placeholder="Optional — tell us more..."></textarea>
          </div>
        </div>

        <label class="checkbox-row"><input type="checkbox" id="followUp"> OK to follow up about this feedback</label>

        <button type="submit" class="submit" id="submitBtn">Submit feedback</button>
        <div class="success-box" id="successBox">✓ Thanks — your feedback was recorded.</div>
      </form>
    </div>
  </div>

  <script>
    let starValue = 0;
    const stars = document.querySelectorAll('#starRating .star');
    stars.forEach(star => {
      star.addEventListener('mouseenter', () => paintStars(+star.dataset.value));
      star.addEventListener('click', () => {
        starValue = +star.dataset.value;
        paintStars(starValue);
      });
    });
    document.getElementById('starRating').addEventListener('mouseleave', () => paintStars(starValue));
    function paintStars(value) {
      stars.forEach(s => s.classList.toggle('filled', +s.dataset.value <= value));
    }

    let npsValue = null;
    const npsBtns = document.querySelectorAll('#npsScale .scale-btn');
    npsBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        npsBtns.forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
        npsValue = btn.dataset.value;
      });
    });

    const form = document.getElementById('feedbackForm');
    const submitBtn = document.getElementById('submitBtn');
    const successBox = document.getElementById('successBox');
    const starMsg = document.getElementById('starMsg');

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      starMsg.textContent = '';
      successBox.classList.remove('show');

      if (starValue === 0) {
        starMsg.textContent = 'Please select a star rating.';
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Submitting...';
      setTimeout(() => {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Submit feedback';
        successBox.classList.add('show');
      }, 700);
    });
  </script>
</body>
</html>
