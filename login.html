<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-void: #05070c;
    --bg-panel: #0d1219;
    --bg-card: #10161f;
    --accent: #5eead4;
    --accent-dim: #1f5f56;
    --amber: #fbbf24;
    --text: #e6edf3;
    --muted: #6b7684;
    --border: #1c232d;
    --error: #f47174;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Inter', sans-serif;
    background: var(--bg-void);
    color: var(--text);
    min-height: 100vh;
    display: flex;
  }
  .terminal {
    flex: 1;
    background: var(--bg-panel);
    background-image:
      linear-gradient(rgba(94,234,212,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(94,234,212,0.04) 1px, transparent 1px);
    background-size: 28px 28px;
    padding: 48px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    position: relative;
    overflow: hidden;
    min-width: 0;
  }
  .terminal::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, var(--accent), transparent 60%);
  }
  .brand {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.06em;
    color: var(--accent);
    margin-bottom: 60px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .brand .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 8px var(--accent); }
  .console {
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    line-height: 1.9;
    color: var(--muted);
    max-width: 420px;
  }
  .console .prompt { color: var(--accent); }
  .console .line { opacity: 0; animation: reveal 0.4s forwards; white-space: pre-wrap; }
  .console .line:nth-child(1) { animation-delay: 0.2s; }
  .console .line:nth-child(2) { animation-delay: 0.9s; }
  .console .line:nth-child(3) { animation-delay: 1.6s; }
  .console .line:nth-child(4) { animation-delay: 2.3s; }
  @keyframes reveal { to { opacity: 1; } }
  .cursor {
    display: inline-block;
    width: 8px; height: 16px;
    background: var(--accent);
    animation: blink 1s step-end infinite;
    vertical-align: middle;
    margin-left: 2px;
  }
  @keyframes blink { 50% { opacity: 0; } }
  .headline {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 30px;
    font-weight: 500;
    margin-top: 44px;
    max-width: 380px;
    line-height: 1.3;
    color: var(--text);
    opacity: 0;
    animation: reveal 0.6s forwards;
    animation-delay: 3.0s;
  }
  .headline span { color: var(--accent); }

  .panel-form {
    flex: 1;
    background: var(--bg-void);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px;
  }
  .form-wrap { width: 100%; max-width: 360px; }
  .eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--muted);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 10px;
  }
  h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 28px;
    font-weight: 500;
    margin-bottom: 8px;
  }
  .sub { color: var(--muted); font-size: 14px; margin-bottom: 36px; }
  form { display: flex; flex-direction: column; gap: 20px; }
  .field { position: relative; }
  .field label {
    display: block;
    font-size: 12px;
    font-family: 'JetBrains Mono', monospace;
    color: var(--muted);
    margin-bottom: 8px;
    letter-spacing: 0.03em;
  }
  .field input {
    width: 100%;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 13px 14px;
    color: var(--text);
    font-size: 14px;
    font-family: 'Inter', sans-serif;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .field input::placeholder { color: #3d4552; }
  .field input:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(94,234,212,0.12);
  }
  .field.error input { border-color: var(--error); }
  .field .msg { font-size: 12px; color: var(--error); margin-top: 6px; min-height: 14px; }
  .toggle-pw {
    position: absolute;
    right: 14px;
    top: 38px;
    background: none;
    border: none;
    color: var(--muted);
    font-size: 11px;
    font-family: 'JetBrains Mono', monospace;
    cursor: pointer;
    letter-spacing: 0.03em;
  }
  .toggle-pw:hover { color: var(--accent); }
  .row-between { display: flex; justify-content: space-between; align-items: center; font-size: 13px; }
  .row-between a { color: var(--accent); text-decoration: none; }
  .checkbox-row { display: flex; align-items: center; gap: 8px; color: var(--muted); }
  .checkbox-row input { accent-color: var(--accent); width: 15px; height: 15px; }

  button.submit {
    margin-top: 6px;
    background: var(--accent);
    color: #04241e;
    border: none;
    border-radius: 6px;
    padding: 14px;
    font-size: 14px;
    font-weight: 600;
    font-family: 'Space Grotesk', sans-serif;
    cursor: pointer;
    transition: transform 0.1s, background 0.15s;
    letter-spacing: 0.02em;
  }
  button.submit:hover { background: #7ff3e0; }
  button.submit:active { transform: scale(0.98); }

  .divider {
    display: flex; align-items: center; gap: 12px;
    color: var(--muted); font-size: 12px; margin: 28px 0;
    font-family: 'JetBrains Mono', monospace;
  }
  .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }

  .foot { text-align: center; font-size: 14px; color: var(--muted); }
  .foot a { color: var(--accent); text-decoration: none; font-weight: 500; }

  @media (max-width: 820px) {
    body { flex-direction: column; }
    .terminal { min-height: 260px; padding: 32px; }
    .headline { font-size: 22px; }
  }
</style>
</head>
<body>

  <div class="terminal">
    <div class="brand"><span class="dot"></span>POC // AUTH</div>
    <div class="console">
      <div class="line"><span class="prompt">$</span> whoami</div>
      <div class="line">&gt; guest</div>
      <div class="line"><span class="prompt">$</span> auth --login</div>
      <div class="line">&gt; awaiting credentials<span class="cursor"></span></div>
    </div>
    <div class="headline">Access your <span>workspace</span> in one step.</div>
  </div>

  <div class="panel-form">
    <div class="form-wrap">
      <div class="eyebrow">Session</div>
      <h1>Sign in</h1>
      <p class="sub">Enter your credentials to continue.</p>

      <form id="loginForm" novalidate>
        <div class="field" id="emailField">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email">
          <div class="msg" id="emailMsg"></div>
        </div>

        <div class="field" id="passwordField">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password">
          <button type="button" class="toggle-pw" id="togglePw">SHOW</button>
          <div class="msg" id="passwordMsg"></div>
        </div>

        <div class="row-between">
          <label class="checkbox-row"><input type="checkbox" id="remember"> Remember me</label>
          <a href="#">Forgot password?</a>
        </div>

        <button type="submit" class="submit">Sign in →</button>
      </form>

      <div class="divider">or</div>

      <p class="foot">New here? <a href="signup.html">Create an account</a></p>
    </div>
  </div>

  <script>
    const togglePw = document.getElementById('togglePw');
    const pwInput = document.getElementById('password');
    togglePw.addEventListener('click', () => {
      const isPw = pwInput.type === 'password';
      pwInput.type = isPw ? 'text' : 'password';
      togglePw.textContent = isPw ? 'HIDE' : 'SHOW';
    });

    const form = document.getElementById('loginForm');
    const emailField = document.getElementById('emailField');
    const passwordField = document.getElementById('passwordField');

    function setError(field, msgEl, message) {
      field.classList.add('error');
      msgEl.textContent = message;
    }
    function clearError(field, msgEl) {
      field.classList.remove('error');
      msgEl.textContent = '';
    }

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      let valid = true;
      const email = document.getElementById('email').value.trim();
      const password = pwInput.value;
      const emailMsg = document.getElementById('emailMsg');
      const passwordMsg = document.getElementById('passwordMsg');

      clearError(emailField, emailMsg);
      clearError(passwordField, passwordMsg);

      const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if (!emailPattern.test(email)) {
        setError(emailField, emailMsg, 'Enter a valid email address.');
        valid = false;
      }
      if (password.length < 6) {
        setError(passwordField, passwordMsg, 'Password must be at least 6 characters.');
        valid = false;
      }

      if (valid) {
        alert('Login submitted — connect this to your backend API.');
      }
    });
  </script>
</body>
</html>
