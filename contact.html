<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-void: #05070c;
    --bg-panel: #0d1219;
    --bg-card: #10161f;
    --accent: #a78bfa;
    --accent-ink: #1c1533;
    --text: #e6edf3;
    --muted: #6b7684;
    --border: #1c232d;
    --error: #f47174;
    --success: #86efac;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Inter', sans-serif;
    background: var(--bg-void);
    color: var(--text);
    min-height: 100vh;
    display: flex;
  }
  .terminal {
    flex: 1;
    background: var(--bg-panel);
    background-image:
      linear-gradient(rgba(167,139,250,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(167,139,250,0.04) 1px, transparent 1px);
    background-size: 28px 28px;
    padding: 48px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    position: relative;
    overflow: hidden;
    min-width: 0;
  }
  .terminal::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, var(--accent), transparent 60%);
  }
  .brand {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.06em;
    color: var(--accent);
    margin-bottom: 60px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .brand .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 8px var(--accent); }
  .console {
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    line-height: 1.9;
    color: var(--muted);
    max-width: 420px;
  }
  .console .prompt { color: var(--accent); }
  .console .line { opacity: 0; animation: reveal 0.4s forwards; white-space: pre-wrap; }
  .console .line:nth-child(1) { animation-delay: 0.2s; }
  .console .line:nth-child(2) { animation-delay: 0.9s; }
  .console .line:nth-child(3) { animation-delay: 1.6s; }
  .console .line:nth-child(4) { animation-delay: 2.3s; }
  @keyframes reveal { to { opacity: 1; } }
  .cursor {
    display: inline-block;
    width: 8px; height: 16px;
    background: var(--accent);
    animation: blink 1s step-end infinite;
    vertical-align: middle;
    margin-left: 2px;
  }
  @keyframes blink { 50% { opacity: 0; } }
  .headline {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 30px;
    font-weight: 500;
    margin-top: 44px;
    max-width: 380px;
    line-height: 1.3;
    color: var(--text);
    opacity: 0;
    animation: reveal 0.6s forwards;
    animation-delay: 3.0s;
  }
  .headline span { color: var(--accent); }

  .panel-form {
    flex: 1;
    background: var(--bg-void);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px;
  }
  .form-wrap { width: 100%; max-width: 400px; }
  .eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--muted);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 10px;
  }
  h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 28px;
    font-weight: 500;
    margin-bottom: 8px;
  }
  .sub { color: var(--muted); font-size: 14px; margin-bottom: 36px; }
  form { display: flex; flex-direction: column; gap: 20px; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .field { position: relative; }
  .field label {
    display: block;
    font-size: 12px;
    font-family: 'JetBrains Mono', monospace;
    color: var(--muted);
    margin-bottom: 8px;
    letter-spacing: 0.03em;
  }
  .field input, .field select, .field textarea {
    width: 100%;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 13px 14px;
    color: var(--text);
    font-size: 14px;
    font-family: 'Inter', sans-serif;
    transition: border-color 0.15s, box-shadow 0.15s;
    resize: vertical;
  }
  .field textarea { min-height: 120px; line-height: 1.5; }
  .field input::placeholder, .field textarea::placeholder { color: #3d4552; }
  .field input:focus, .field select:focus, .field textarea:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(167,139,250,0.14);
  }
  .field.error input, .field.error textarea, .field.error select { border-color: var(--error); }
  .field .msg { font-size: 12px; color: var(--error); margin-top: 6px; min-height: 14px; }
  .char-count {
    position: absolute;
    right: 4px;
    bottom: -18px;
    font-size: 11px;
    color: var(--muted);
    font-family: 'JetBrains Mono', monospace;
  }
  .char-count.warn { color: var(--error); }

  .topic-pills { display: flex; gap: 8px; flex-wrap: wrap; }
  .pill {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    padding: 8px 14px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: var(--bg-card);
    color: var(--muted);
    cursor: pointer;
    transition: all 0.15s;
  }
  .pill:hover { border-color: var(--accent); color: var(--text); }
  .pill.active { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }

  button.submit {
    margin-top: 10px;
    background: var(--accent);
    color: var(--accent-ink);
    border: none;
    border-radius: 6px;
    padding: 14px;
    font-size: 14px;
    font-weight: 600;
    font-family: 'Space Grotesk', sans-serif;
    cursor: pointer;
    transition: transform 0.1s, background 0.15s;
    letter-spacing: 0.02em;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  button.submit:hover { background: #c4b5fd; }
  button.submit:active { transform: scale(0.98); }
  button.submit:disabled { opacity: 0.6; cursor: default; }

  .success-box {
    display: none;
    align-items: center;
    gap: 10px;
    background: rgba(134,239,172,0.08);
    border: 1px solid rgba(134,239,172,0.3);
    color: var(--success);
    padding: 14px 16px;
    border-radius: 6px;
    font-size: 13px;
    font-family: 'JetBrains Mono', monospace;
    margin-top: 20px;
  }
  .success-box.show { display: flex; }

  @media (max-width: 820px) {
    body { flex-direction: column; }
    .terminal { min-height: 240px; padding: 32px; }
    .headline { font-size: 22px; }
    .row2 { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

  <div class="terminal">
    <div class="brand"><span class="dot"></span>POC // CONTACT</div>
    <div class="console">
      <div class="line"><span class="prompt">$</span> ping support</div>
      <div class="line">&gt; channel open</div>
      <div class="line"><span class="prompt">$</span> msg --compose</div>
      <div class="line">&gt; awaiting input<span class="cursor"></span></div>
    </div>
    <div class="headline">Send us a <span>message</span>, we'll route it fast.</div>
  </div>

  <div class="panel-form">
    <div class="form-wrap">
      <div class="eyebrow">Get in touch</div>
      <h1>Contact us</h1>
      <p class="sub">Fill this out and we'll reply within one business day.</p>

      <form id="contactForm" novalidate>
        <div class="row2">
          <div class="field" id="nameField">
            <label for="name">Full name</label>
            <input type="text" id="name" name="name" placeholder="Jane Doe" autocomplete="name">
            <div class="msg" id="nameMsg"></div>
          </div>
          <div class="field" id="emailField">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email">
            <div class="msg" id="emailMsg"></div>
          </div>
        </div>

        <div class="field">
          <label>Topic</label>
          <div class="topic-pills" id="topicPills">
            <div class="pill active" data-topic="general">General</div>
            <div class="pill" data-topic="support">Support</div>
            <div class="pill" data-topic="billing">Billing</div>
            <div class="pill" data-topic="partnership">Partnership</div>
          </div>
        </div>

        <div class="field" id="subjectField">
          <label for="subject">Subject</label>
          <input type="text" id="subject" name="subject" placeholder="Brief summary">
          <div class="msg" id="subjectMsg"></div>
        </div>

        <div class="field" id="messageField" style="margin-bottom: 6px;">
          <label for="message">Message</label>
          <textarea id="message" name="message" maxlength="600" placeholder="Tell us what's going on..."></textarea>
          <span class="char-count" id="charCount">0 / 600</span>
          <div class="msg" id="messageMsg"></div>
        </div>

        <button type="submit" class="submit" id="submitBtn">Send message →</button>

        <div class="success-box" id="successBox">✓ Message sent — we'll be in touch shortly.</div>
      </form>
    </div>
  </div>

  <script>
    const topicPills = document.querySelectorAll('#topicPills .pill');
    let selectedTopic = 'general';
    topicPills.forEach(pill => {
      pill.addEventListener('click', () => {
        topicPills.forEach(p => p.classList.remove('active'));
        pill.classList.add('active');
        selectedTopic = pill.dataset.topic;
      });
    });

    const messageEl = document.getElementById('message');
    const charCount = document.getElementById('charCount');
    messageEl.addEventListener('input', () => {
      const len = messageEl.value.length;
      charCount.textContent = `${len} / 600`;
      charCount.classList.toggle('warn', len > 550);
    });

    const form = document.getElementById('contactForm');
    const submitBtn = document.getElementById('submitBtn');
    const successBox = document.getElementById('successBox');

    function setError(fieldId, msgId, message) {
      document.getElementById(fieldId).classList.add('error');
      document.getElementById(msgId).textContent = message;
    }
    function clearError(fieldId, msgId) {
      document.getElementById(fieldId).classList.remove('error');
      document.getElementById(msgId).textContent = '';
    }

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      let valid = true;
      successBox.classList.remove('show');

      ['nameField','emailField','subjectField','messageField'].forEach((f, i) => {
        clearError(f, ['nameMsg','emailMsg','subjectMsg','messageMsg'][i]);
      });

      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const subject = document.getElementById('subject').value.trim();
      const message = messageEl.value.trim();
      const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

      if (name.length < 2) { setError('nameField', 'nameMsg', 'Enter your full name.'); valid = false; }
      if (!emailPattern.test(email)) { setError('emailField', 'emailMsg', 'Enter a valid email address.'); valid = false; }
      if (subject.length < 3) { setError('subjectField', 'subjectMsg', 'Add a short subject.'); valid = false; }
      if (message.length < 10) { setError('messageField', 'messageMsg', 'Message should be at least 10 characters.'); valid = false; }

      if (valid) {
        submitBtn.disabled = true;
        submitBtn.textContent = 'Sending...';
        setTimeout(() => {
          submitBtn.disabled = false;
          submitBtn.textContent = 'Send message →';
          successBox.classList.add('show');
          form.reset();
          charCount.textContent = '0 / 600';
          topicPills.forEach(p => p.classList.remove('active'));
          document.querySelector('.pill[data-topic="general"]').classList.add('active');
        }, 900);
      }
    });
  </script>
</body>
</html>
